backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 18;
shadow-opacity = 0.28;

corner-radius = 12;
rounded-corners-exclude = [ "class_g = 'Pillarium'" ];

blur-method = "dual_kawase";
blur-strength = 7;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;

fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;

opacity-rule = [
  "100:class_g = 'Pillarium'",
  "100:window_type = 'desktop'"
];

detect-client-opacity = true;